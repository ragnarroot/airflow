name: Deploy to Airflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, airflow]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy risk dashboard
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" \
            /home/sl-ragnar/airflow/python_scripts/risk_dashboard/
